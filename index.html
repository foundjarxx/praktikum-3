<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- GANTI [NIM] DI BAWAH INI DENGAN NIM KAMU SEBELUM DEPLOY -->
  <title>Struk Pengeluaran — NIM [NIM]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="desk">

    <header class="desk__header">
      <p class="desk__eyebrow">Catatan harian</p>
      <h1 class="desk__title">Struk Pengeluaran</h1>
      <p class="desk__sub">Setiap rupiah yang keluar, tercatat di sini.</p>
    </header>

    <main class="layout">

      <!-- FORM TAMBAH PENGELUARAN -->
      <section class="panel form-panel" aria-labelledby="form-heading">
        <h2 id="form-heading" class="panel__heading">Catat pengeluaran</h2>

        <form id="expense-form" novalidate>
          <div class="field">
            <label for="expense-name">Keterangan</label>
            <input
              type="text"
              id="expense-name"
              name="expense-name"
              placeholder="cth. Makan siang"
              autocomplete="off"
              required
            />
          </div>

          <div class="field">
            <label for="expense-amount">Nominal (Rp)</label>
            <input
              type="number"
              id="expense-amount"
              name="expense-amount"
              placeholder="cth. 25000"
              min="1"
              step="1"
              required
            />
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>

          <button type="submit" class="btn-add">+ Tambah pengeluaran</button>
        </form>
      </section>

      <!-- STRUK / DAFTAR PENGELUARAN -->
      <section class="panel receipt-panel" aria-labelledby="receipt-heading">
        <h2 id="receipt-heading" class="panel__heading">Rincian</h2>

        <div class="receipt">
          <ul id="expense-list" class="receipt__list">
            <!-- item pengeluaran akan dimasukkan lewat JavaScript -->
          </ul>

          <p id="empty-state" class="empty-state">
            Belum ada pengeluaran yang dicatat.
          </p>

          <div class="receipt__divider" aria-hidden="true"></div>

          <div class="receipt__summary">
            <div class="summary-row">
              <span>Jumlah transaksi</span>
              <span id="expense-count">0</span>
            </div>
            <div class="summary-row summary-row--total">
              <span>Total</span>
              <span id="expense-total">Rp0</span>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="desk__footer">
      <p>Data disimpan sementara di browser kamu (localStorage) — tidak ada server maupun database.</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
